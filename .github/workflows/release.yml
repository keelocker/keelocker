name: Release DMG

"on":
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag and release draft to build, verify and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: keelocker-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  dmg:
    name: Universal macOS DMG
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      RUSTUP_TOOLCHAIN: stable
      KEELOCKER_RELEASE_ARCHS: arm64 x86_64
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Resolve candidate version
        run: |
          label="${RELEASE_TAG#v}"
          if [[ ! "$label" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid release tag" >&2
            exit 1
          fi
          build_number="$(awk '/CURRENT_PROJECT_VERSION =/ { gsub(/;/, "", $3); versions[$3] = 1 } END { for (v in versions) { value = v; count++ } if (count != 1 || value !~ /^[1-9][0-9]*$/) exit 1; print value }' KeeLocker.xcodeproj/project.pbxproj)"
          echo "KEELOCKER_RELEASE_LABEL=$label" >> "$GITHUB_ENV"
          echo "KEELOCKER_BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "KEELOCKER_RELEASE_OUTPUT=$RUNNER_TEMP/keelocker-release" >> "$GITHUB_ENV"
      - name: Require selected Xcode
        run: xcodebuild -version
      - name: Require update signing key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: test -n "$SPARKLE_PRIVATE_KEY"
      - name: Install Rust and both macOS targets
        run: rustup toolchain install stable --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin
      - name: Fetch locked dependency sources for notices
        run: cargo fetch --locked
      - name: Build and inspect universal DMG
        run: bash scripts/release.sh build
      - name: Verify draft assets and publish
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          python3 scripts/publish-update.py
          --release-dir "$KEELOCKER_RELEASE_OUTPUT"
          --tools "$KEELOCKER_RELEASE_OUTPUT/DerivedData/SourcePackages/artifacts/sparkle/Sparkle/bin"
          --tag "$RELEASE_TAG"
